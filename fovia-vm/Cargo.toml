[package]
name = "fovia-vm"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.10.0"
core_affinity = "0.8.3"
fxhash = "0.2"

windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_Networking",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_SystemInformation",
] }

[features]
unsafe-opt = []

[profile.release]
# 高速化・デバッグ最小化設定
opt-level = 3           # 最高速最適化
lto = true              # Link Time Optimization
codegen-units = 1       # 単一ユニットで最適化
debug = false           # デバッグ情報を生成しない
strip = true            # バイナリからデバッグ情報を削除
panic = "abort"         # パニック時即終了（ランタイムコスト減）
overflow-checks = false # オーバーフロー検査を無効化
incremental = false     # インクリメンタルコンパイルを無効化
debug-assertions = false # デバッグアサーションを無効化

